apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    app.kubernetes.io/part-of: dev-sandbox
    pod-security.kubernetes.io/enforce: baseline
---
# 1. ResourceQuota to protect cluster resources
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-resource-quota
  namespace: sandbox
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "2Gi"
    limits.cpu: "2500m"
    limits.memory: "4Gi"
    pods: "10"
    services: "5"
---
# 2. LimitRange to ensure pods define sensible limits
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limit-range
  namespace: sandbox
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1500m"
        memory: "1536Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
---
# 3. NetworkPolicy: Restrict Sandbox Blast Radius
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation-policy
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to frontend and API from anywhere in cluster (Gateway Fabric)
    - from: []
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow intra-namespace traffic (API -> Redis/DB if in namespace)
    - to:
        - podSelector: {}
---
# 4. ConfigMap: Environment Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: sandbox
data:
  APP_ENV: "production"
  SITE_DOMAIN: "gateaway.cloud"
  CORS_ORIGINS: '["https://gateaway.cloud"]'
  DB_STATEMENT_TIMEOUT_MS: "1500"
  RATE_LIMIT_GLOBAL: "60/minute"
  RATE_LIMIT_PROBE: "15/minute"
---
# 5. Create sandbox-secrets separately; never commit credentials.
---
# 6. Deployment: Frontend (React + Vite + Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-sandbox
  namespace: sandbox
  labels:
    app: frontend-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-sandbox
  template:
    metadata:
      labels:
        app: frontend-sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: frontend
          image: devsandbox-frontend:20261122-1354
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
# 7. Service: Frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend-sandbox
  namespace: sandbox
  labels:
    app: frontend-sandbox
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: frontend-sandbox
---
# 8. Deployment: API Backend (FastAPI + Python 3.11)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-sandbox
  namespace: sandbox
  labels:
    app: api-sandbox
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: api-sandbox
  template:
    metadata:
      labels:
        app: api-sandbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: devsandbox-api:20261122-1354
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sandbox-config
            - secretRef:
                name: sandbox-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
# 9. Service: API Backend
apiVersion: v1
kind: Service
metadata:
  name: api-sandbox
  namespace: sandbox
  labels:
    app: api-sandbox
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: api-sandbox
---
# Allow inventory HTTPRoutes to send frontend and sandbox-only API paths across namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-inventory-routes-to-sandbox-services
  namespace: sandbox
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: inventory
  to:
    - group: ""
      kind: Service
      name: frontend-sandbox
    - group: ""
      kind: Service
      name: api-sandbox
